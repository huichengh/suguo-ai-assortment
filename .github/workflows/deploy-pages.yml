name: Deploy to GitHub Pages

# 把 dist/ 目录发布为在线演示站点。
# 产物是零外链单文件 HTML，无需任何构建步骤，直接静态托管即可。
on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一个部署任务；排队中的旧任务取消
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 校验产物完整性
        run: |
          set -e
          test -f dist/index.html || { echo "::error::dist/index.html 缺失"; exit 1; }
          SIZE=$(wc -c < dist/index.html)
          echo "dist/index.html 体积：${SIZE} bytes"
          # 零外链断言：产物不得引用任何外部资源
          if grep -qiE '<script[^>]+src=|<link[^>]+rel=["'"'"']stylesheet' dist/index.html; then
            echo "::error::产物包含外部资源引用，违反零外链约束"
            exit 1
          fi
          echo "零外链校验通过"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
